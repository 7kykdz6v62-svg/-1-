function merge(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(x=>m.set(x[0]+':'+x[1],x));return [...m.values()].sort((x,y)=>x[0]-y[0]).slice(-30)}
function rec(i,f,r){const e=LG[i]=LG[i]||{h:[],m:[]};const k=f?'m':'h';e[k]=merge(e[k],[[Date.now(),r?1:0]]);saveLocal();qWrite(i)}
function qWrite(i){if(!dbc)return;const e=LG[i],d=D[i];wq=wq.then(()=>dbc.collection('log').doc('i'+i).set({i,n:d.n,f:d.f,c:d.c,h:e.h,m:e.m})).catch(()=>{sync='同期エラー（この端末には保存済み）';draw()})}
function recJ(i){if(jd.h!==null)rec(i,0,jd.h);if(jd.m!==null)rec(i,1,jd.m);jd={h:null,m:null}}
/* ---- 暗記度 ---- */
function fpri(a){if(!a||!a.length)return 7;let w=1,s=0,t=0;a.slice(-8).reverse().forEach(x=>{s+=w*x[1];t+=w;w*=.65});const c=Math.min(1,a.length/3);let p=10*(1-s/t)*c+5*(1-c);const days=(Date.now()-a[a.length-1][0])/864e5;return Math.min(10,p+Math.min(2,days/3))}
const att=i=>LG[i]?LG[i].h.length+LG[i].m.length:0;
function lastTs(i){const e=LG[i];if(!e)return 0;return Math.max(0,...[...e.h,...e.m].map(x=>x[0]))}
function lpri(i){const e=LG[i]||{h:[],m:[]};return Math.max(fpri(e.h),fpri(e.m))}
function pri(i){const lp=lpri(i);if(plan&&plan.pri&&plan.pri[i]!=null){const p=+plan.pri[i];return lastTs(i)>(plan.at||0)?(p+lp)/2:p}return lp}
function status(i){if(!att(i))return '未学習';const p=pri(i);return p>=6?'苦手':p>=3?'学習中':'定着'}
const W=i=>.2+pri(i)**2/10;
function wpick(p,exc){const c=p.filter(d=>d.i!==exc),a=c.length?c:p;let r=Math.random()*a.reduce((s,d)=>s+W(d.i),0);for(const d of a){r-=W(d.i);if(r<=0)return d}return a[a.length-1]}
function wsample(p,n){let a=[...p],o=[];while(o.length<n&&a.length){const d=wpick(a,-1);o.push(d);a=a.filter(x=>x!==d)}return o}

}
function go(){head();setDeck();q=null;ex=null;cur=null;sc=[0,0];draw()}
function stats(){const c={未学習:0,苦手:0,学習中:0,定着:0};D.forEach(d=>c[status(d.i)]++);return `<div class="stat"><span>定着 ${c.定着}</span><span>学習中 ${c.学習中}</span><span>苦手 ${c.苦手}</span><span>未学習 ${c.未学習}</span></div><div class="bar"><i style="width:${c.定着/D.length*100}%"></i></div><div class="tag">記録：${esc(sync)}</div>`}
function judgeUI(){const row=(f,l)=>`<div class="judge"><b>${l}</b><button class="${jd[f]===0?'on':''}" onclick="jd.${f}=0;draw()">わからなかった</button><button class="${jd[f]===1?'on':''}" onclick="jd.${f}=1;draw()">わかった</button></div>`;return `<div class="judge"><button onclick="jd={h:1,m:1};draw()">両方わかった</button><button onclick="jd={h:0,m:0};draw()">両方わからなかった</button></div>`+row('h','書き下し')+row('m','意味')}
function cardHTML(d,md,nextFn){
 const front=md==='f'?`<div class="tag">構文 → 書き下し・意味</div><div class="big">${d.f}</div><div class="sub">${d.n}</div>`:`<div class="tag">例文 → 書き下し・意味</div><div class="big">${d.s}</div>`;
 const back=md==='f'?`<div>書き下し：<span class="k">${d.r}</span></div><div>意味：${d.m}</div>${d.o?`<div class="sub">${d.o}</div>`:''}${exb(d)}`:`<div>書き下し：<span class="k">${d.k}</span></div><div>意味：${d.t}</div><div class="sub">${d.n}：${d.f}（${d.r}）</div>`;
 return `<div class="card"><div class="tag">${status(d.i)}</div>${front}${flip?'<hr style="border:0;border-top:1px solid var(--line)">'+back+judgeUI()+`<div class="act"><button onclick="${nextFn}">記録して次へ</button></div>`:'<div class="act"><button onclick="flip=true;draw()">答えを見る</button></div>'}</div>`}
function nextAuto(){recJ(cur.i);last=cur.i;cur=null;flip=false;draw()}
function nextCard(){recJ(deck[idx%deck.length].i);idx++;flip=false;draw()}
function draw(){
 const a=$('app'),p=pool(),prog=stats();
 if(tab==='exam'){drawExam(prog);return}
 if(tab==='auto'){
  if(!cur){cur=wpick(D,last);curMd=cur.s&&Math.random()<.5?'s':'f';flip=false}
  const msg=plan&&plan.msg?`<div class="ex"><div class="tag">Claudeからのコメント${plan.at?'　'+new Date(plan.at).toLocaleDateString('ja-JP'):''}</div>${esc(plan.msg)}</div>`:'';
  a.innerHTML=prog+msg+cardHTML(cur,curMd,'nextAuto()');return}
 if(!p.length){a.innerHTML=prog+'<div class="card">この条件の項目はありません。別の絞り込みを選んでください。</div>';return}
 if(tab==='list'){a.innerHTML=prog+p.map(d=>{const e=LG[d.i]||{h:[],m:[]};return `<details><summary><span class="badge">${status(d.i)}</span>${d.n}　<span class="sub">${d.m}</span></summary><div class="big" style="font-size:20px">${d.f}</div><div>書き下し：<span class="k">${d.r}</span></div>${d.o?`<div class="sub">${d.o}</div>`:''}${exb(d)}<div class="tag">書き下し ${e.h.map(x=>x[1]?'○':'×').join('')||'—'}　意味 ${e.m.map(x=>x[1]?'○':'×').join('')||'—'}</div></details>`}).join('')+`<details><summary>記録をチャットに貼る用</summary><textarea readonly onclick="this.select()">${esc(exportText())}</textarea></details>`;return}
 if(tab==='card'){
  if(!deck.length)setDeck();const d=deck[idx%deck.length],md=mode==='m'?((d.s&&(d.i+idx)%2)?'s':'f'):mode;
  a.innerHTML=prog+`<div class="row"><select onchange="mode=this.value;go()"><option value="f"${mode==='f'?' selected':''}>構文を覚える</option><option value="s"${mode==='s'?' selected':''}>例文を覚える</option><option value="m"${mode==='m'?' selected':''}>構文・例文ミックス</option></select><button onclick="setDeck();draw()">シャッフル</button></div><div class="tag">${idx%deck.length+1} / ${deck.length}</div>`+cardHTML(d,md,'nextCard()');return}
 if(!q)nextQ(p);
 const d=q.d;
 a.innerHTML=prog+`<div class="sub">正解 ${sc[0]} / ${sc[1]}</div><div class="card"><div class="tag">${status(d.i)}　${q.t?'この構文の意味は？':'書き下し文は？'}</div><div class="big">${q.t?d.f:d.s}</div>${q.o.map((o,j)=>`<button class="opt ${q.a!==null?(o.i===d.i?'right':j===q.a?'wrong':''):''}" ${q.a!==null?'disabled':''} onclick="pick(${j})">${q.t?o.m:o.k}</button>`).join('')}${q.a!==null?`<div class="ex"><span class="${q.o[q.a].i===d.i?'ok':'ng'}">${q.o[q.a].i===d.i?'わかった（正解）':'わからなかった（不正解）'}</span>　${d.n}：${d.f}（${d.r}）${exb(d)}</div><div class="act"><button onclick="last=q.d.i;q=null;draw()">次へ</button></div>`:''}</div>`;
}
function mkQ(d){const t=!d.s||Math.random()<.4;const f=x=>t?x.m:x.k;const ds=shuf(D.filter(x=>x.i!==d.i&&(t||x.s)&&f(x)!==f(d))).slice(0,3);return{d,t,o:shuf([d,...ds]),a:null}}
function nextQ(p){q=mkQ(wpick(p,last))}
function pick(j){q.a=j;sc[1]++;const ok=q.o[j].i===q.d.i;if(ok)sc[0]++;rec(q.d.i,q.t?1:0,ok);draw()}
function startExam(){ex={qs:wsample(D,20).map(mkQ),i:0,sc:0,miss:[]}}
function examPick(j){const x=ex.qs[ex.i];if(x.a!==null)return;x.a=j;const ok=x.o[j].i===x.d.i;if(ok)ex.sc++;else ex.miss.push(x.d);rec(x.d.i,x.t?1:0,ok);draw()}
function drawExam(prog){
 const a=$('app');if(!ex)startExam();
 if(ex.i>=ex.qs.length){a.innerHTML=prog+`<div class="card"><div class="big">${ex.sc} / ${ex.qs.length}</div><div class="sub">苦手な項目ほど出やすい20問です。結果は記録されました。</div>${ex.miss.length?'<div style="margin-top:10px">間違えた項目</div>'+ex.miss.map(d=>`<details><summary>${d.n}　<span class="sub">${d.m}</span></summary><div>${d.f}（${d.r}）</div>${exb(d)}</details>`).join(''):'<div class="ok">全問正解です。</div>'}<div class="act"><button onclick="ex=null;draw()">もう一度（別の20問）</button></div></div>`;return}
 const x=ex.qs[ex.i],d=x.d;
 a.innerHTML=prog+`<div class="sub">${ex.i+1} / ${ex.qs.length}　正解 ${ex.sc}</div><div class="card"><div class="tag">${x.t?'この構文の意味は？':'書き下し文は？'}</div><div class="big">${x.t?d.f:d.s}</div>${x.o.map((o,j)=>`<button class="opt ${x.a!==null?(o.i===d.i?'right':j===x.a?'wrong':''):''}" ${x.a!==null?'disabled':''} onclick="examPick(${j})">${x.t?o.m:o.k}</button>`).join('')}${x.a!==null?`<div class="ex"><span class="${x.o[x.a].i===d.i?'ok':'ng'}">${x.o[x.a].i===d.i?'正解':'不正解'}</span>　${d.n}：${d.f}（${d.r}）${exb(d)}</div><div class="act"><button onclick="ex.i++;draw()">${ex.i+1<ex.qs.length?'次へ':'結果を見る'}</button></div>`:''}</div>`;
}
function exportText(){const l=[];D.forEach(d=>{const e=LG[d.i];if(e)l.push(`${d.i} ${d.n} 書:${e.h.map(x=>x[1]).join('')||'-'} 意:${e.m.map(x=>x[1]).join('')||'-'}`)});return l.length?'漢文記録(1=わかった,0=わからなかった,古→新)\n'+l.join('\n'):'まだ記録がありません'}
/* ---- 旧「覚えた／まだ」記録の取り込み（1回だけ） ---- */
try{if(!localStorage.getItem('kb-mig')){let o=null;try{o=JSON.parse(localStorage.getItem('kb-known2')||'null')}catch(e){}
 if(!o){try{const a=JSON.parse(localStorage.getItem('kb-known')||'null');if(a){o={};a.forEach(i=>o[i]=[1,1])}}catch(e){}}
 const ids=[];if(o){const t=Date.now()-3*864e5;Object.keys(o).forEach(k=>{const i=+k;if(!D[i]||!Array.isArray(o[k]))return;const e=LG[i]=LG[i]||{h:[],m:[]};if(!e.h.length&&!e.m.length){e.h=[[t,o[k][0]?1:0]];e.m=[[t,o[k][1]?1:0]];ids.push(i)}})}
 localStorage.setItem('kb-mig','1');localStorage.setItem('kb-mig-ids',JSON.stringify(ids));saveLocal()}}catch(e){}
go();
(async()=>{try{if(typeof claude==='undefined')return;const db=await claude.use('db');if(!db)return;dbc=db;sync='Claudeと共有中';
 try{const g=await db.collection('log').get();g.docs.forEach(x=>{const v=x.data();if(!v||v.i==null||!D[v.i])return;const e=LG[v.i]=LG[v.i]||{h:[],m:[]};e.h=merge(e.h,v.h);e.m=merge(e.m,v.m)});const ids=JSON.parse(localStorage.getItem('kb-mig-ids')||'[]');ids.forEach(i=>qWrite(i));if(ids.length)localStorage.setItem('kb-mig-ids','[]')}catch(e){}
MIG.forEach(i=>qWrite(i));
 db.collection('log').onSnapshot(s=>{s.docs.forEach(x=>{const v=x.data();if(!v||v.i==null||!D[v.i])return;const e=LG[v.i]=LG[v.i]||{h:[],m:[]};e.h=merge(e.h,v.h);e.m=merge(e.m,v.m)});saveLocal();draw()},()=>{sync='同期エラー（この端末には保存済み）';draw()});
 db.doc('plan/now').onSnapshot(s=>{plan=s.exists?s.data():null;draw()},()=>{})}catch(e){}})();
</script></body></html>
