 back=md==='f'?`<div>書き下し：<span class="k">${d.r}</span></div><div>意味：${d.m}</div>${d.o?`<div class="sub">${d.o}</div>`:''}${exb(d)}`:`<div>書き下し：<span class="k">${d.k}</span></div><div>意味：${d.t}</div><div class="sub">${d.n}：${d.f}（${d.r}）</div>`}
 return `<div class="card"><div class="tag">${status(d.i)}${d.g==='2'?'　2次':''}</div>${front}${flip?'<hr style="border:0;border-top:1px solid var(--line)">'+back+judgeUI(d)+'<div class="sub">選ばずに次へ進むと「わからなかった」として記録されます。</div>'+`<div class="act"><button onclick="${nextFn}">記録して次へ</button></div>`:'<div class="act"><button onclick="flip=true;warn=false;draw()">答えを見る</button></div>'}</div>`}
let warn=false;
const nj=d=>jd.h===null&&jd.m===null;
function skipJ(f){jd={h:null,m:null};warn=false;if(f==='nextAuto'){last=cur.i;cur=null}else idx++;flip=false;draw()}
function fillJ(d){if(jd.m===null)jd.m=0;if(!d.p&&jd.h===null)jd.h=0}
function nextAuto(){fillJ(cur);recJ(cur.i);last=cur.i;cur=null;flip=false;draw()}
function nextCard(){const d=deck[idx%deck.length];fillJ(d);recJ(d.i);idx++;flip=false;if(idx>=deck.length)setDeck();else deck=[...deck.slice(0,idx),...wsample(deck.slice(idx),deck.length-idx)];draw()}
const qBody=(x,fn)=>`<div class="tag">${status(x.d.i)}　${x.ti}</div><div class="big">${x.st}</div>${x.o.map((o,j)=>`<button class="opt ${x.a!==null?(o.ok?'right':j===x.a?'wrong':''):''}" ${x.a!==null?'disabled':''} onclick="${fn}(${j})">${o.x}</button>`).join('')}`;
function draw(){
 const a=$('app'),p=pool(),prog=stats();
 if(tab==='exam'){drawExam(prog);return}
 if(tab==='auto'){
  if(!cur){cur=wpick(R(),last);curMd=cur.e||(cur.s&&Math.random()<.5)?'s':'f';flip=false}
  const msg=plan&&plan.msg?`<div class="ex"><div class="tag">Claudeからのコメント${plan.at?'　'+new Date(plan.at).toLocaleDateString('ja-JP'):''}</div>${esc(plan.msg)}</div>`:'';
  a.innerHTML=prog+msg+cardHTML(cur,curMd,'nextAuto()');return}
 if(!p.length){a.innerHTML=prog+'<div class="card">この条件の項目はありません。別の絞り込みを選んでください。</div>';return}
 if(tab==='list'){a.innerHTML=prog+p.map(d=>{const e=LG[d.i]||{h:[],m:[]};return `<details><summary><span class="badge">${status(d.i)}</span>${ttl(d)}</summary>${d.p?`<div class="big" style="font-size:18px">${d.f}</div><div class="sub">${d.p.o.map(x=>'・'+x).join('<br>')}</div>`+expl(d):`<div class="big" style="font-size:20px">${d.f}</div><div>書き下し：<span class="k">${d.r}</span></div>${d.o?`<div class="sub">${d.o}</div>`:''}${exb(d)}`}<div class="tag">${d.p?'':'書き下し '+e.h.map(x=>x[1]?'○':'×').join('')+'　'}意味 ${e.m.map(x=>x[1]?'○':'×').join('')||'—'}</div></details>`}).join('')+`<details><summary>記録をチャットに貼る用</summary><textarea readonly onclick="this.select()">${esc(exportText())}</textarea></details>`;return}
 if(tab==='card'){
  if(!deck.length)setDeck();const d=deck[idx%deck.length],md=d.e||kd==='s'?'s':kd==='g'?'f':((d.s&&(d.i+idx)%2)?'s':'f');
  a.innerHTML=prog+`<div class="row"><button onclick="setDeck();draw()">並べ直す</button></div><div class="sub">わかった／わからなかった記録をもとに、苦手なカードほど先に出ます。</div><div class="tag">${idx%deck.length+1} / ${deck.length}</div>`+cardHTML(d,md,'nextCard()');return}
 if(!q)nextQ(p);
 a.innerHTML=prog+`<div class="sub">正解 ${sc[0]} / ${sc[1]}</div><div class="card">${qBody(q,'pick')}${q.a!==null?`<div class="ex"><span class="${q.o[q.a].ok?'ok':'ng'}">${q.o[q.a].ok?'わかった（正解）':'わからなかった（不正解）'}</span>　${expl(q.d)}</div><div class="act"><button onclick="last=q.d.i;q=null;draw()">次へ</button></div>`:''}</div>`;
}
function mkQ(d){
 if(d.p)return{d,k:'x',ti:lbl(d),st:d.f,o:shuf(d.p.o.map((x,j)=>({x,ok:j===0}))),a:null};
 const pf=tab==='exam'?'all':kd,t=!d.s||(d.e?false:pf==='g'?true:pf==='s'?false:Math.random()<.4),f=x=>t?x.m:x.k;
 const seen=new Set([f(d)]),ds=[];shuf(R().filter(x=>!x.p&&!(t&&x.e)&&x.i!==d.i&&(t?x.m:x.s))).forEach(x=>{if(ds.length<3&&!seen.has(f(x))){seen.add(f(x));ds.push(x)}});
 return{d,k:t?'m':'k',ti:t?'この構文の意味は？':'書き下し文は？',st:t?d.f:d.s,o:shuf([d,...ds].map(x=>({x:f(x),ok:x===d}))),a:null}}
function nextQ(p){q=mkQ(wpick(p,last))}
const qf=x=>x.k==='k'?0:1;
function pick(j){q.a=j;sc[1]++;const ok=q.o[j].ok;if(ok)sc[0]++;rec(q.d.i,qf(q),ok);draw()}
function startExam(){ex={qs:wsample(R(),20).map(d=>mkQ(d)),i:0,sc:0,miss:[]}}
function examPick(j){const x=ex.qs[ex.i];if(x.a!==null)return;x.a=j;const ok=x.o[j].ok;if(ok)ex.sc++;else ex.miss.push(x.d);rec(x.d.i,qf(x),ok);draw()}
function drawExam(prog){
 const a=$('app');if(!ex)startExam();
 if(ex.i>=ex.qs.length){a.innerHTML=prog+`<div class="card"><div class="big">${ex.sc} / ${ex.qs.length}</div><div class="sub">苦手な項目ほど出やすい${ex.qs.length}問です。結果は記録されました。</div>${ex.miss.length?'<div style="margin-top:10px">間違えた項目</div>'+ex.miss.map(d=>`<details><summary>${ttl(d)}</summary>${expl(d)}</details>`).join(''):'<div class="ok">全問正解です。</div>'}<div class="act"><button onclick="ex=null;draw()">もう一度（別の問題）</button></div></div>`;return}
 const x=ex.qs[ex.i];
 a.innerHTML=prog+`<div class="sub">${ex.i+1} / ${ex.qs.length}　正解 ${ex.sc}</div><div class="card">${qBody(x,'examPick')}${x.a!==null?`<div class="ex"><span class="${x.o[x.a].ok?'ok':'ng'}">${x.o[x.a].ok?'正解':'不正解'}</span>　${expl(x.d)}</div><div class="act"><button onclick="ex.i++;draw()">${ex.i+1<ex.qs.length?'次へ':'結果を見る'}</button></div>`:''}</div>`;
}
function exportText(){const l=[];D.forEach(d=>{const e=LG[d.i];if(e&&!d.x)l.push(`${d.i} ${d.n} 書:${e.h.map(x=>x[1]).join('')||'-'} 意:${e.m.map(x=>x[1]).join('')||'-'}`)});return l.length?'漢文記録(1=わかった,0=わからなかった,古→新)\n'+l.join('\n'):'まだ記録がありません'}
/* ---- 旧「覚えた／まだ」記録の取り込み（1回だけ） ---- */
try{if(!localStorage.getItem('kb-mig')){let o=null;try{o=JSON.parse(localStorage.getItem('kb-known2')||'null')}catch(e){}
 if(!o){try{const a=JSON.parse(localStorage.getItem('kb-known')||'null');if(a){o={};a.forEach(i=>o[i]=[1,1])}}catch(e){}}
 const ids=[];if(o){const t=Date.now()-3*864e5;Object.keys(o).forEach(k=>{const i=+k;if(!D[i]||!Array.isArray(o[k]))return;const e=LG[i]=LG[i]||{h:[],m:[]};if(!e.h.length&&!e.m.length){e.h=[[t,o[k][0]?1:0]];e.m=[[t,o[k][1]?1:0]];ids.push(i)}})}
 localStorage.setItem('kb-mig','1');localStorage.setItem('kb-mig-ids',JSON.stringify(ids));saveLocal()}}catch(e){}
go();
(async()=>{try{if(typeof claude==='undefined')return;const db=await claude.use('db');const us=await claude.use('user');if(!db||!us)return;const uid=await us.id();if(!uid||us.can('data.write')===false){sync='この端末のみ（記録はほかの人に共有されません）';draw();return}base='data/users/'+uid;dbc=db;sync=us.isOwner()?'Claudeと共有中':'自分専用の記録（ほかの人には見えません）';
 try{const g=await db.collection(base).get();g.docs.forEach(x=>{const v=x.data();if(!v||v.i==null||!D[v.i])return;const e=LG[v.i]=LG[v.i]||{h:[],m:[]};e.h=merge(e.h,v.h);e.m=merge(e.m,v.m)});const ids=JSON.parse(localStorage.getItem('kb-mig-ids')||'[]');ids.forEach(i=>qWrite(i));if(ids.length)localStorage.setItem('kb-mig-ids','[]')}catch(e){}
MIG.forEach(i=>qWrite(i));
 db.collection(base).onSnapshot(s=>{s.docs.forEach(x=>{const v=x.data();if(!v||v.i==null||!D[v.i])return;const e=LG[v.i]=LG[v.i]||{h:[],m:[]};e.h=merge(e.h,v.h);e.m=merge(e.m,v.m)});saveLocal();draw()},()=>{sync='同期エラー（この端末には保存済み）';draw()});
 db.doc(base+'/plan').onSnapshot(s=>{plan=s.exists?s.data():null;draw()},()=>{})}catch(e){}})();
